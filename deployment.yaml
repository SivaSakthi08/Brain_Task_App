apiVersion: apps/v1
kind: Deployment

metadata:
  name: brain-task-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: brain-tasks

  template:
    metadata:
      labels:
        app: brain-tasks

    spec:
      containers:
        - name: brain-tasks-container
          image: sivasakthi08/brain-tasks-app:latest
          ports:
            - containerPort: 80
